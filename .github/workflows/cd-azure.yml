name: CD - Azure Container Apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login to Azure -- no client secrets stored
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  BACKEND_APP: ${{ vars.BACKEND_APP_NAME }}
  FRONTEND_APP: ${{ vars.FRONTEND_APP_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---- Reuse phase-2 quality gate: nothing ships unless it's linted & tested ----
  test-backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  test-frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # ---- Secret scanning gate: fail the pipeline if credentials leak into the diff ----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: [test-backend, test-frontend, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & scan backend image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/securebank-backend:${{ env.IMAGE_TAG }} ./backend
      - name: Trivy scan - backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/securebank-backend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Build & scan frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://${{ env.BACKEND_APP }}.$(az containerapp env show -n ${{ vars.CAE_NAME }} -g ${{ env.RESOURCE_GROUP }} --query properties.defaultDomain -o tsv) \
            -t ${{ env.ACR_NAME }}.azurecr.io/securebank-frontend:${{ env.IMAGE_TAG }} ./frontend
      - name: Trivy scan - frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/securebank-frontend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Push images
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/securebank-backend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/securebank-frontend:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production   # required reviewer approval configurable here
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # New revision per deploy -> Container Apps keeps the prior revision running
      # until this one passes health probes, giving zero-downtime, instantly-revertible releases.
      - name: Deploy backend revision
        run: |
          az containerapp update \
            -n ${{ env.BACKEND_APP }} -g ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/securebank-backend:${{ env.IMAGE_TAG }} \
            --revision-suffix gh${{ github.run_number }}

      - name: Deploy frontend revision
        run: |
          az containerapp update \
            -n ${{ env.FRONTEND_APP }} -g ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/securebank-frontend:${{ env.IMAGE_TAG }} \
            --revision-suffix gh${{ github.run_number }}

      - name: Smoke test
        run: |
          URL=$(az containerapp show -n ${{ env.BACKEND_APP }} -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS "https://$URL/api/health"
