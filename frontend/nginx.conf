server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass https://securebankhai2026-api.internal.yellowsand-673d28c6.southeastasia.azurecontainerapps.io;

        proxy_ssl_server_name on;
        proxy_ssl_name securebankhai2026-api.internal.yellowsand-673d28c6.southeastasia.azurecontainerapps.io;

        proxy_http_version 1.1;
        proxy_set_header Host securebankhai2026-api.internal.yellowsand-673d28c6.southeastasia.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~* \.(?:js|css|svg|woff2?|png|jpg|jpeg)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}